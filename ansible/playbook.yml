---
- name: Deploy to Tomcat
  hosts: web
  become: yes
  tasks:
    - name: Copy WAR file to Tomcat
      copy:
        src: "/var/snap/jenkins/4853/workspace/aditi-CICD/target/aditi.war"
        dest: "/opt/tomcat/webapps/aditi.war"
        remote_src: no
    - name:  Restart Tomcat
      systemd:
        name: tomcat
        state: restarted
